        <h1>Entre em contato conosco</h1>
        <p>Se você tiver alguma dúvida, sugestão ou quiser nos ajudar, <br>entre em contato conosco através do
            formulário abaixo:</p>

        <form action="enviar_contato.php" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for=telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40" required></textarea><br><br>

            <input type="submit" value="Enviar">
            <!-- O formulário acima coleta o nome, email, telefone e mensagem do usuário e envia para o arquivo enviar_contato.php -->
        </form>
